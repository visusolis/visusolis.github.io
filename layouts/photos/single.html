{{ define "main" }}

<style>
.photo-entry img {
  display: block;
  width: 100vw;
  max-width: 100vw;
  margin: 0 calc(-50vw + 50%) 1.5rem;
}
.entry-meta { font-size: 0.65em; color: #BECACC; margin-bottom: 1.5rem; }
</style>

<h1>{{ .Title }}</h1>
<p class="entry-meta">{{ .Date.Format "January 2006" }}</p>

<div class="photo-entry">
  {{ range .Params.photos }}
  <img src="{{ . }}" alt="">
  {{ end }}
</div>

{{ with .Content }}
<content>{{ . }}</content>
{{ end }}

{{ partial "entry-nav.html" . }}

{{ end }}
