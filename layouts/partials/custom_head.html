{{ with .Params.script }}
  {{ $js := resources.Get . | minify }}
  <script src="{{ $js.RelPermalink }}"></script>
{{ end }}

<!-- Google Fonts: Cormorant Garamond -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

<!-- Custom fonts -->
<style>
@font-face {
  font-family: 'Orangerie';
  src: url('/fonts/orangerie.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

html {
  background-color: #3A494A;
  background-image:
    radial-gradient(ellipse at 0% 0%, #3A4A43 0%, transparent 55%),
    radial-gradient(ellipse at 100% 0%, #3A414A 0%, transparent 55%),
    radial-gradient(ellipse at 100% 100%, #3A4A43 0%, transparent 55%),
    radial-gradient(ellipse at 0% 100%, #3A414A 0%, transparent 55%);
  min-height: 100%;
}

body {
  font-family: 'Cormorant Garamond', serif !important;
  font-size: 26px !important;
  line-height: 1.5 !important;
  color: #D7DFE0 !important;
  background: transparent !important;
  overflow-x: hidden !important;
}

content img:not(.tl-logo):not(.entry-image) {
  display: block;
  width: 100vw;
  max-width: 100vw;
  position: relative;
  left: calc(50% - 50vw);
}

html::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='noise'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23noise)'/></svg>");
  opacity: 0.25;
  pointer-events: none;
  z-index: 9999;
}

h1, h2, h3, h4, h5, h6 {
  color: #A4B6B7 !important;
  text-align: right !important;
}

ul.blog-posts li {
  justify-content: space-between !important;
}

ul.blog-posts li span {
  flex: 0 0 auto !important;
  text-align: right !important;
}

a {
  color: #D4AEAB !important;
  text-decoration: none !important;
}

.post-footer {
  display: flex !important;
  align-items: center !important;
  justify-content: flex-end !important;
  gap: 0.5rem !important;
}

header {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 2rem !important;
  flex-wrap: wrap !important;
}

header .title {
  flex: 0 0 auto !important;
  width: max-content !important;
}

header nav {
  display: flex !important;
  flex-wrap: wrap !important;
  align-items: center !important;
  gap: 1rem !important;
}

header nav a {
  margin-right: 0 !important;
}

@media (max-width: 600px) {
  body {
    font-size: 20px !important;
  }

  header {
    display: block !important;
  }

  header .title,
  header .title h1 {
    display: inline !important;
    width: auto !important;
    margin: 0 !important;
    vertical-align: baseline !important;
    line-height: inherit !important;
  }

  header nav {
    display: inline !important;
    font-size: inherit !important;
  }
}

header nav a::before {
  content: ' .';
  opacity: 0.5;
}

.title h1 {
  font-family: 'Cormorant Garamond', serif !important;
  font-size: 26px !important;
  font-weight: normal !important;
  margin: 0 !important;
}

@media (max-width: 600px) {
  .title h1 {
    font-size: 20px !important;
  }
}

/* ── Tags ───────────────────────────────────────────── */

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin: 0.8rem 0;
}

.tags span {
  font-size: 0.58em;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #BECACC;
  padding: 0.15em 0.5em 0.15em 0;
}

/* ── Work page: vertical scroll timeline ────────────── */

.work-section-title { display: none; }

.v-timeline {
  --spine: 0.6rem;          /* single source of truth */
  --pad: 2rem;
  position: relative;
  padding-left: var(--pad);
  margin: 1.5rem 0 3rem;
}

/* Spine */
.v-timeline::before {
  content: '';
  position: absolute;
  left: var(--spine);
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(215,223,224,0.12);
}

/* TODAY marker */
.tl-now {
  position: relative;
  font-size: 0.65em;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #8EA2A4;
  margin-bottom: 1.8rem;
}
/* 10px dot — center on spine: spine - pad - 5px */
.tl-now::before {
  content: '';
  position: absolute;
  left: calc(var(--spine) - var(--pad) - 5px);
  top: 50%;
  transform: translateY(-50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(215,223,224,0.65);
}

/* Year divider — out of flow, rotated left of spine */
.tl-year {
  position: relative;
  height: 0;
  overflow: visible;
  margin: 2.5rem 0 0;
  border: none;
  padding: 0;
}
.tl-year::before {
  content: attr(data-year);
  position: absolute;
  left: calc(var(--spine) - var(--pad) - 1.8rem);
  top: 0;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 0.58em;
  letter-spacing: 0.1em;
  color: #8EA2A4;
  white-space: nowrap;
}

/* Section label (Corporate / Education) */
.tl-section {
  font-size: 0.6em;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #8EA2A4;
  margin: 3rem 0 1.2rem;
  border-bottom: 1px solid #4A5A5B;
  padding-bottom: 0.3rem;
}

/* Entry */
.tl-entry {
  position: relative;
  margin-bottom: 1.8rem;
}

/* 8px dot — center on spine: spine - pad - 4px */
.tl-entry::before {
  content: '';
  position: absolute;
  left: calc(var(--spine) - var(--pad) - 4px);
  top: 0.48em;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1px solid rgba(215,223,224,0.3);
  background: #3A494A;
  box-sizing: border-box;
}

/* Filled accent dot for ongoing */
.tl-entry.ongoing::before {
  background: #D4AEAB;
  border-color: #D4AEAB;
}

.tl-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: nowrap;
}

.tl-logo {
  width: 40px;
  height: 40px;
  object-fit: contain;
  border-radius: 4px;
  opacity: 0.85;
  filter: grayscale(1);
  flex-shrink: 0;
  order: 99;
  margin-left: auto;
}

.tl-meta {
  font-size: 0.78em;
  color: #BECACC;
}

.tl-desc {
  font-size: 0.8em;
  color: #BECACC;
  line-height: 1.45;
}

/* Scroll-reveal animation */
@keyframes tl-reveal {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@supports (animation-timeline: scroll()) {
  .tl-entry {
    animation: tl-reveal linear both;
    animation-timeline: view();
    animation-range: entry 0% entry 28%;
  }
}

</style>
